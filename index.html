const LABELS={"ja": ["エピソード", "言語", "最初から読む", "次のエピソードは準備中", "日本語原画を表示しています。翻訳版は制作中です。"], "en": ["Episodes", "Language", "Read from start", "Next episode coming soon", "Original Japanese pages are shown. Translations are in preparation."], "zh-CN": ["章节", "语言", "从头阅读", "下一章制作中", "目前显示日语原版。翻译正在准备中。"], "zh-TW": ["章節", "語言", "從頭閱讀", "下一章製作中", "目前顯示日文原版。翻譯正在準備中。"], "ko": ["에피소드", "언어", "처음부터 읽기", "다음 에피소드 준비 중", "현재 일본어 원본을 표시합니다. 번역 준비 중입니다."], "es": ["Episodios", "Idioma", "Leer desde el inicio", "Próximo episodio en preparación", "Se muestran las páginas originales en japonés. Traducciones en preparación."], "fr": ["Épisodes", "Langue", "Lire depuis le début", "Prochain épisode en préparation", "Les pages originales japonaises sont affichées. Traductions en préparation."], "pt": ["Episódios", "Idioma", "Ler desde o início", "Próximo episódio em preparação", "As páginas originais em japonês são exibidas. Traduções em preparação."]};
const OVERLAYS={"en": {}, "zh-CN": {}, "zh-TW": {}, "ko": {}, "es": {}, "fr": {}, "pt": {}};
const langSelect=document.getElementById('language');const preferred=localStorage.getItem('astro-lang')||'ja';langSelect.value=LABELS[preferred]?preferred:'ja';
function applyLanguage(){const l=langSelect.value;localStorage.setItem('astro-lang',l);document.documentElement.lang=l;const a=LABELS[l];document.getElementById('epLabel').textContent=a[0];document.getElementById('langLabel').textContent=a[1];document.getElementById('start').textContent=a[2]+' ↑';document.getElementById('next').textContent=a[3];document.getElementById('notice').textContent=l==='ja'?'':a[4];document.querySelectorAll('.overlay').forEach(el=>el.replaceChildren());if(l==='ja')return;const pages=OVERLAYS[l]||{};for(const [page,bubbles] of Object.entries(pages)){const el=document.querySelector('[data-overlay="'+page+'"]');if(!el)continue;for(const b of bubbles){const d=document.createElement('div');d.className='bubble';d.style.left=b.x+'%';d.style.top=b.y+'%';d.style.width=b.w+'%';d.style.height=b.h+'%';d.style.fontSize='clamp(8px,'+(b.font||2)+'vw,20px)';d.textContent=b.text;el.append(d)}}}
langSelect.addEventListener('change',applyLanguage);applyLanguage();
</script></body></html>
